# ==========================================
# Kerdion: Unified Docker Compose
# Run from project root: docker compose up --build
# ==========================================

services:
  # ---- Infrastructure ----
  postgres:
    image: postgres:15-alpine
    container_name: kerdion_postgres
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kerdion_network

  redis:
    image: redis:7-alpine
    container_name: kerdion_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - kerdion_network

  # ---- Backend ----
  api:
    build: ./backend
    container_name: kerdion_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    networks:
      - kerdion_network

  celery_worker:
    build: ./backend
    container_name: kerdion_celery_worker
    restart: always
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - postgres
    networks:
      - kerdion_network

  # ---- Frontend ----
  frontend:
    build:
      context: ./frontend
      target: runtime
    container_name: kerdion_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - api
    networks:
      - kerdion_network

volumes:
  postgres_data:

networks:
  kerdion_network:
    driver: bridge
