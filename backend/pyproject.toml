[tool.poetry]
name = "kerdion-backend"
version = "0.1.0"
description = "Kerdion: Real-time cryptocurrency volatility forecasting platform"
authors = ["Fanis Dimitriou"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"          # The core web framework
uvicorn = {extras = ["standard"], version = "^0.29.0"} # The ASGI server
sqlalchemy = "^2.0.29"        # Database ORM
asyncpg = "^0.29.0"           # Async Postgres driver
alembic = "^1.13.1"           # Database migrations
redis = "^5.0.3"              # In-memory data structure store (Broker)
celery = "^5.3.6"             # Background task queue
pydantic-settings = "^2.2.1"  # Validates our .env variables
httpx = "^0.28.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "^3.2.0"
python-multipart = "^0.0.9"
email-validator = "^2.1.1"

# Heavy/slow-changing ML dependencies. Kept in their own group so the
# Dockerfile can install them in an earlier, independently-cached layer -
# adding/bumping a lightweight dep above shouldn't force torch et al. to
# reinstall from scratch on every build.
[tool.poetry.group.heavy.dependencies]
pandas = "^2.2.1"             # Data manipulation for ML
numpy = "^1.26.4"             # Array calculations for ML
torch = "^2.13.0"
scikit-learn = "^1.9.0"
arch = "^8.0.0"
joblib = "^1.5.3"

[tool.poetry.dev-dependencies]
pytest = "^8.1.1"             # Testing framework
ruff = "^0.3.5"               # Blazing fast linter and formatter
httpx = "^0.28.1"             # Required for testing FastAPI endpoints

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --- Ruff Configuration ---
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"] # Enables standard errors, fatal errors, and import sorting